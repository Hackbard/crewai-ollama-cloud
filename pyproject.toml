[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crewai-ollama-cloud"
version = "0.1.0"
description = "Custom LLM provider for CrewAI connecting to cloud-hosted Ollama instances"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "crewai>=0.80.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/crewai_ollama_cloud"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
