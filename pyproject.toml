[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crewai-ollama-cloud"
version = "0.1.0"
description = "Custom CrewAI LLM provider for Ollama's native REST API — no OpenAI shim, NDJSON streaming, tool calling, cloud auth"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Hackbard"},
]
keywords = ["crewai", "ollama", "llm", "provider", "ai", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "crewai>=0.80.0",
    "httpx>=0.25.0",
]

[project.urls]
Homepage = "https://github.com/Hackbard/crewai-ollama-cloud"
Repository = "https://github.com/Hackbard/crewai-ollama-cloud"
Issues = "https://github.com/Hackbard/crewai-ollama-cloud/issues"
Changelog = "https://github.com/Hackbard/crewai-ollama-cloud/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/crewai_ollama_cloud"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
